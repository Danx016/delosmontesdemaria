version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: agro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - agro-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build: .
    container_name: agro-gateway
    command: node services/gateway/server.js
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CATALOG_SERVICE_URL=http://catalog-service:3002
      - ORDER_SERVICE_URL=http://order-service:3003
      - AI_SUPPORT_SERVICE_URL=http://ai-support-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
      order-service:
        condition: service_started
      ai-support-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - agro-network

  auth-service:
    build: .
    container_name: agro-auth-service
    command: node services/auth-service/server.js
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - AUTH_SERVICE_PORT=3001
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agro-network

  catalog-service:
    build: .
    container_name: agro-catalog-service
    command: node services/catalog-service/server.js
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - CATALOG_SERVICE_PORT=3002
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agro-network

  order-service:
    build: .
    container_name: agro-order-service
    command: node services/order-service/server.js
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - ORDER_SERVICE_PORT=3003
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agro-network

  ai-support-service:
    build: .
    container_name: agro-ai-support-service
    command: node services/ai-support-service/server.js
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - AI_SUPPORT_SERVICE_PORT=3004
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agro-network

  notification-service:
    build: .
    container_name: agro-notification-service
    command: node services/notification-service/server.js
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - NOTIFICATION_SERVICE_PORT=3005
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agro-network

volumes:
  redis-data:

networks:
  agro-network:
    driver: bridge
